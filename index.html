<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillVerse Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome Back to SkillVerse</h1>

    <form id="loginForm">

        <label for="loginEmail">Email</label>
        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your Gmail"
            required
        >

        <label for="loginPassword">Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
        >

        <br>

        <button class="login-main-btn" type="button" onclick="login()">
            Login
        </button>

        <br><br>

        <button class="login-btn" type="button" onclick="goToSignup()">
            Don't have an account? Sign Up
        </button>

    </form>

    <script src="script.js"></script>

</body>

</html>
