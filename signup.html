<!DOCTYPE html>
<html>

<head>

    <title>SkillVerse Sign Up</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Create Your SkillVerse Account</h1>

    <form>
          

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

         <label>Password</label>
<input type="password" placeholder="Enter your password">

<label>Confirm Password</label>
<input type="password" placeholder="Confirm your password">

        <label>Phone Number</label>
         <input type="tel" placeholder="Enter your Phone Number ">



         <label>Location</label>
        <input type="text" placeholder="Enter your  Address">



        <label>Skill You Can Offer</label>
        <input type="text" placeholder="Example: Cooking, Guitar, Coding">

    


      

            
      

        <button class="signup-btn" type="button" onclick="signup()">Sign Up</button>
        <br><br>

        <button class="login-btn" type="button" onclick="goToLogin()">Already have an account? Login</button>


    </form>

</body>

</html>
